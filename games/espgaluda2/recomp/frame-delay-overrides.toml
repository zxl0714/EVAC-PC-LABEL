# Bound to the verified default.xex identity in games/espgaluda2/data.json.
# Publish only after the native VBlank handler has released its spinlock.
[[midasm_hook]]
address = 0x8217064C
name = "G2CompletedVblank"
registers = ["context", "memory"]

# After native predicate reset, replace only the commands that queue the wait.
# The hook checks the saved return address to keep other callers on the native path.
[[midasm_hook]]
address = 0x821708D8
name = "G2SkipQueuedVblank"
registers = ["context", "memory"]
jump_address_on_true = 0x82170A58

# Return site of the verified swap call at 0x82171420. r31 is still the
# device, and r3 carries the original return value through this hook.
[[midasm_hook]]
address = 0x82171424
name = "G2PaceAfterSwap"
registers = ["context", "memory"]
