# Independently reviewed static XDK API wrappers in the supported disc base.
# The title's qualification, score construction and confirmations stay intact.
# Community capability remains disabled until the SDOJ provider is accepted.
[[midasm_hook]]
address = 0x8221C418
name = "SdojCommunityEstimateRank"
registers = ["r3", "r4", "r5", "r6", "r7"]
return = true

