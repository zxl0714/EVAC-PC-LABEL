# Supported disc-base only. Optional read-only observation, not TU lag patches.
[[midasm_hook]]
address = 0x82178B78
name = "SdojInputPassBegin"
registers = ["r3"]

# Immediately after each XamInputGetState wrapper returns. r27/r30 are the
# preserved per-user slot base; returned X_INPUT_STATE lives at slot + 516.
[[midasm_hook]]
address = 0x821A3D90
name = "SdojInputPollExisting"
registers = ["r3", "r30", "r27"]

[[midasm_hook]]
address = 0x821A3EA8
name = "SdojInputPollDiscovery"
registers = ["r3", "r28", "r30"]

# After lhz r11,520(r29); before the engine copies raw wButtons onward.
[[midasm_hook]]
address = 0x821A3C38
name = "SdojInputButtonCopy"
registers = ["r11", "r31"]

# Polling and input-object conversion have returned, before update dispatch.
[[midasm_hook]]
address = 0x82178BFC
name = "SdojInputPassEnd"
registers = ["r31"]

# Main engine iteration: polling returned; the render/update entry follows.
[[midasm_hook]]
address = 0x8217E9C8
name = "SdojLatencyHostBegin"
registers = []
[[midasm_hook]]
address = 0x8217E9D0
name = "SdojLatencyHostEnd"
registers = []

# Original disc call immediately before VdSwap. Observe its existing ring-buffer
# argument, retaining the original import and all of its writes unchanged.
[[midasm_hook]]
address = 0x821DFECC
name = "SdojLatencySubmit"
registers = ["r3"]

# Original native graphics queue. Observe the completed slot store while its
# original lock is held, and the successful pop before its original return.
[[midasm_hook]]
address = 0x8219DCFC
name = "SdojLatencyNativeEnqueue"
registers = ["r31", "r11", "r9"]
[[midasm_hook]]
address = 0x8219DDE8
name = "SdojLatencyNativeEnqueue"
registers = ["r31", "r11", "r9"]
[[midasm_hook]]
address = 0x8219DED4
name = "SdojLatencyNativeDequeue"
registers = ["r11", "r4"]

# Frame-end message processing sets the original callback-cleared flag here,
# then loops at D9B4 until zero. Neither observation is inside that loop.
[[midasm_hook]]
address = 0x8219D9B0
name = "SdojLatencyNativeWaitBegin"
registers = []
[[midasm_hook]]
address = 0x8219D9C8
name = "SdojLatencyNativeWaitEnd"
registers = []
