# Supported disc-base engine only; observes original 44-byte work queues.
# Begin/end bracket the actual bounded push, not the wrapper's unconditional 1.
[[midasm_hook]]
address = 0x8217D4A8
name = "SdojAudioEngineEnqueueBegin"
registers = ["r3", "r4"]
[[midasm_hook]]
address = 0x8217D514
name = "SdojAudioEngineEnqueueEnd"
registers = ["r3", "r31"]

# Original memcpy has copied the popped command to engine + 120. One site is
# for the global queue, the other for a per-channel queue; both still execute.
[[midasm_hook]]
address = 0x821900B8
name = "SdojAudioEngineHead"
registers = ["r31", "r30"]
[[midasm_hook]]
address = 0x82190160
name = "SdojAudioEngineHead"
registers = ["r31", "r30"]

# Opcode 2 native play: bank/raw branches, before each virtual call. Preserve
# final gain and its three multipliers verbatim; do not change audio state.
[[midasm_hook]]
address = 0x821906FC
name = "SdojAudioEnginePlay"
registers = ["r31", "f1", "f27", "f30", "f31", "r11"]
[[midasm_hook]]
address = 0x82190774
name = "SdojAudioEnginePlay"
registers = ["r31", "f1", "f27", "f30", "f31", "r11"]
[[midasm_hook]]
address = 0x821908C4
name = "SdojAudioEnginePlay"
registers = ["r31", "f1", "f27", "f30", "f31", "r11"]
[[midasm_hook]]
address = 0x8219093C
name = "SdojAudioEnginePlay"
registers = ["r31", "f1", "f27", "f30", "f31", "r11"]

# One common return join per pair: no duplicate bank-path return observation.
[[midasm_hook]]
address = 0x82190778
name = "SdojAudioEnginePlayReturned"
registers = ["r3", "r31"]
[[midasm_hook]]
address = 0x82190940
name = "SdojAudioEnginePlayReturned"
registers = ["r3", "r31"]
