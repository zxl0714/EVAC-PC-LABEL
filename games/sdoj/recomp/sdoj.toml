# Known disc-base programs, generated from local data. TU is tracked separately.
[project]
name = "sdoj"
sdk_version = "0.9.0"
game_root = "../../../game-data/sdoj"

[entrypoint]
file_path = "../../../game-data/sdoj/default.xex"
out_directory_path = "../../../generated/sdoj/default"
includes = ["default-functions.toml", "community-overrides.toml", "input-diagnostics-overrides.toml", "audio-diagnostics-overrides.toml", "frame-delay-host.toml"]

[[modules]]
guest_path = "CA022100.bin"
file_path = "../../../game-data/sdoj/CA022100.bin"
out_directory_path = "../../../generated/sdoj/CA022100"
includes = ["CA022100-functions.toml", "CA022100-input-diagnostics.toml", "CA022100-audio-diagnostics.toml", "CA022100-compat.toml", "CA022100-frame-delay.toml"]

[[modules]]
guest_path = "CA022110.bin"
file_path = "../../../game-data/sdoj/CA022110.bin"
out_directory_path = "../../../generated/sdoj/CA022110"
includes = ["CA022110-functions.toml", "CA022110-input-diagnostics.toml", "CA022110-audio-diagnostics.toml", "CA022110-frame-delay.toml"]
