; CAVE PC Collection — UTF-8. Save changes and restart the game.
; Player configuration: user-data/config.ini. Paths are relative to the collection root.
[collection]
config_version = 1
language = zh

[display]
fullscreen = false
vsync = true

[audio]
volume = 1.0

[gamepad]
enabled = true
deadzone = 0.20

[keyboard]
up = Up
down = Down
left = Left
right = Right
south = Z
east = X
west = C
north = V
start = Enter
select = Backspace
l1 = A
r1 = S
l2 = Q
r2 = W
l3 = none
r3 = none

[community]
enabled = true
endpoint = https://xiaolu.life/cave/api/v1
nickname = Player

[game.futari]
data_dir = game-data/futari
dlc_dir = game-data/futari/dlc

[game.espgaluda2]
data_dir = game-data/espgaluda2

[game.ketsui]
data_dir = game-data/ketsui

[game.sdoj]
data_dir = game-data/sdoj

[game.daioujou]
data_dir = game-data/daioujou
