; EVAC PC LABEL — UTF-8. Save changes and restart the game.
; Player configuration: user-data/config.ini. Paths are relative to the collection root.
[collection]
config_version = 1
language = zh
selected_game = futari
check_for_updates = true

[display]
fullscreen = false
window_width = 1280
window_height = 720
; Host presentation only; the original game timing is preserved.
vsync = false

[audio]
volume = 1.0

[gamepad]
enabled = true
deadzone = 0.20

[keyboard]
up = Up
down = Down
left = Left
right = Right
south = Z
east = X
west = C
north = V
start = Enter
select = Backspace
l1 = A
r1 = S
l2 = Q
r2 = W
l3 = none
r3 = none

[community]
enabled = true
endpoint = https://xiaolu.life/cave/api/v1
nickname = Player

[game.futari]
data_dir = game-data/futari
dlc_dir = auto

[game.espgaluda2]
data_dir = game-data/espgaluda2
; 1 = low latency (default); 2 = original.
frame_delay = 1

[game.ketsui]
data_dir = game-data/ketsui
neo = true

[game.sdoj]
data_dir = game-data/sdoj
frame_delay = 1

[game.daioujou]
data_dir = game-data/daioujou
neo = true

[game.esprade]
data_dir = game-data/esprade
neo = true

[game.guwange]
data_dir = game-data/guwange

[game.feveron]
data_dir = game-data/feveron
neo = true

; Xbox 360 mode: arrows move the character, I/K/J/L move Shikigami; W summons it.
[game.guwange.keyboard]
right_stick_up = I
right_stick_down = K
right_stick_left = J
right_stick_right = L

[game.garegga]
data_dir = game-data/garegga
