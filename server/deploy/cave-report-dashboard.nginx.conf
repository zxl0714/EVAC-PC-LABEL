# Include inside the xiaolu.life HTTPS server block after configuring the
# Basic Auth file. The report service itself only listens on loopback.
location = /cave/reports { return 308 /cave/reports/; }
location ^~ /cave/reports/ {
    auth_basic "EVAC Reports";
    auth_basic_user_file /etc/nginx/evac-report-dashboard.htpasswd;
    limit_req zone=futari_requests burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18094;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    proxy_hide_header Server;
}
