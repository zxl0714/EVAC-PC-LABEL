; ESPGaluda2 PC player configuration. UTF-8; restart after editing.
; Root config.ini is the only player configuration; no setup window is required.
; Keyboard keys map to Xbox 360 buttons, not game-specific actions.

[display]
fullscreen = false
vsync = true

[keyboard]
up = Up
down = Down
left = Left
right = Right
a = Z
b = X
x = C
y = V
start = Enter
back = Backspace
lb = A
rb = S
lt = Q
rt = W
ls = none
rs = none

[gamepad]
enabled = true
deadzone = 0.20

[audio]
volume = 1.0

[logging]
level = info

; Development community bridge; local validation only, public service not deployed.
; Endpoint is the collection API root, e.g. http://127.0.0.1:18086/cave/api/v1.
; No public G2 server is deployed yet; keep disabled for normal offline play.
[community]
enabled = false
endpoint =
nickname = Player
